server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # IMPORTANT: nginx's add_header does NOT merge across levels — a location
    # that declares even one add_header DROPS every add_header inherited from
    # the server block. The security headers are therefore repeated in each
    # location that sets Cache-Control, rather than written once below.

    # Next's static export writes /about as about.html, not about/index.html,
    # unless trailingSlash is set. Both forms are tried so the config survives
    # that setting being changed later. A real miss falls through to Next's own
    # 404 page rather than silently serving the home page at a wrong URL.
    location / {
        try_files $uri $uri.html $uri/index.html /404.html;
    }

    # Content-addressed build output — the filename changes whenever the bytes
    # do, so it can be cached indefinitely.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # The entry document must never be cached, or a visitor keeps a stale shell
    # pointing at chunk files that no longer exist after a deploy.
    location = /index.html {
        add_header Cache-Control "no-store";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 1024;

    # Traefik terminates TLS and forwards plain HTTP here, so this is what the
    # browser ultimately receives over HTTPS.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
